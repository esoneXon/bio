<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kuesioner Indomaret</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    /* Reset & Base Setup */
    :root {
      --bg-color: #F6F6F2;
      --card-color: #FFD84D;
      --text-main: #1A1A1A;
      --primary-blue: #4CB5F9;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh; 
      overflow: hidden;
    }

    #app-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      background-color: var(--bg-color);
      background-image: radial-gradient(#d1d1d1 1px, transparent 1px);
      background-size: 20px 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.05);
    }

    .screen {
      display: none;
      flex-direction: column;
      height: 100%;
      width: 100%;
      box-sizing: border-box;
      position: absolute;
      top: 0;
      left: 0;
    }
    .screen.active {
      display: flex;
      animation: fadeIn 0.4s ease-out forwards;
    }
    @keyframes fadeIn { 
      from { opacity: 0; transform: translateX(15px); } 
      to { opacity: 1; transform: translateX(0); } 
    }

    /* Top Section (Pertanyaan) */
    .top-section {
      padding: max(40px, env(safe-area-inset-top)) 30px 20px 30px;
      flex-shrink: 0;
    }
    
    .progress-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 24px;
    }
    .progress-dot {
      height: 6px;
      flex-grow: 1;
      background-color: #e0e0e0;
      border-radius: 4px;
      transition: background-color 0.3s ease;
    }
    .progress-dot.active {
      background-color: var(--primary-blue);
    }
    
    .question-text {
      font-size: clamp(22px, 5vw, 26px);
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.4;
      margin: 0;
    }

    /* Bottom Section (Opsi Jawaban) */
    .yellow-card {
      background-color: var(--card-color);
      border-radius: 40px 40px 0 0;
      padding: 40px 30px calc(30px + env(safe-area-inset-bottom)) 30px;
      margin-top: auto;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .option-btn {
      background-color: white;
      border: 3px solid transparent;
      border-radius: 16px;
      padding: 16px 20px;
      margin-bottom: 12px;
      font-size: 15px;
      font-weight: 600;
      color: #333;
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: all 0.2s ease;
      text-align: left;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .option-btn:hover { border-color: rgba(255,255,255,0.5); transform: translateY(-1px); }
    .option-btn:active { transform: translateY(1px); }
    .option-btn.selected {
      border-color: var(--text-main);
      background-color: #fdfdfd;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    
    .option-label {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background-color: #e0f2fe;
      color: #0369a1;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-right: 15px;
      font-size: 13px;
      font-weight: 800;
      flex-shrink: 0;
    }
    
    input[type="number"] {
      width: 100%;
      box-sizing: border-box;
      padding: 18px 20px;
      border: 2px solid transparent;
      border-radius: 16px;
      font-size: 16px;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      outline: none;
      margin-bottom: 20px;
      background: rgba(255,255,255,0.7);
      transition: all 0.3s;
    }
    input[type="number"]:focus { 
      background: white; 
      border-color: var(--text-main);
    }

    .btn-submit {
      background-color: var(--text-main);
      color: white;
      border: none;
      border-radius: 30px;
      padding: 18px;
      font-size: 16px;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
      flex-shrink: 0;
      margin-top: auto;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-submit:disabled { 
      background-color: #666; 
      color: #aaa;
      cursor: not-allowed; 
      transform: none;
    }
    .btn-submit:not(:disabled):active {
      transform: scale(0.98);
    }

    #btn-mulai { margin-top: 30px; }

    /* Center Content Khusus Intro, Outro & Blocked */
    .center-content {
      text-align: center;
      justify-content: center;
      align-items: center;
      padding: 40px;
      padding-bottom: calc(40px + env(safe-area-inset-bottom));
    }
    .center-content h1 { font-size: clamp(24px, 6vw, 28px); color: var(--text-main); margin-bottom: 16px; line-height: 1.4; }
    .center-content p { font-size: 15px; color: #555; margin-bottom: 0; line-height: 1.6; }
  </style>
</head>
<body>

  <div id="app-container">
    
    <!-- 1. INTRO SCREEN -->
    <div id="screen-intro" class="screen center-content active">
      <h1>Selamat Datang 👋</h1>
      <p>Minta waktunya sebentar ya untuk isi kuis ini 😁🙏</p>
      <button class="btn-submit" id="btn-mulai">Mulai Kuis</button>
    </div>

    <!-- 2. QUIZ SCREEN -->
    <div id="screen-quiz" class="screen">
      <div class="top-section">
        <div class="progress-bar" id="progress-bar"></div>
        <h2 class="question-text" id="question-text">Loading pertanyaan...</h2>
      </div>
      
      <div class="yellow-card">
        <div id="input-area"></div>
        <button class="btn-submit" id="btn-next" disabled>Selanjutnya</button>
      </div>
    </div>

    <!-- 3. OUTRO SCREEN -->
    <div id="screen-outro" class="screen center-content">
      <h1 style="font-size: 40px;">🎉</h1>
      <h1>Terimakasih!</h1>
      <p>Sudah meluangkan waktu untuk mengisi kuis ini ❤️😁</p>
    </div>

    <!-- 4. BLOCKED SCREEN (Jika sudah pernah mengisi) -->
    <div id="screen-blocked" class="screen center-content">
      <h1 style="font-size: 40px;">🚫</h1>
      <h1>Akses Ditolak</h1>
      <p>Anda/Perangkat ini sudah pernah mengisi kuesioner. Pengisian hanya diperbolehkan 1 kali saja 🙏</p>
    </div>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>

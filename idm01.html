<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Ekspor Data</title>
  <style>
    body { font-family: sans-serif; padding: 40px; background-color: #f4f7f6; text-align: center; }
    .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    button { padding: 15px 25px; font-size: 16px; font-weight: bold; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; transition: 0.3s; }
    button:hover { background-color: #218838; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }
    p { color: #555; margin-bottom: 20px; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Panel Admin Kuesioner</h2>
    <p>Klik tombol di bawah ini untuk menarik semua data jawaban dari database dan mengunduhnya sebagai file CSV dengan Header dan Keterangan Lengkap.</p>
    <button id="btnUnduh">Unduh Data (CSV)</button>
    <p id="statusText" style="margin-top: 15px; font-weight: bold; color: #007bff;"></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // Konfigurasi Firebase Anda
    const firebaseConfig = {
      apiKey: "AIzaSyCWErOEhDXiCyOYh3bggDRLMF7w4xImiKg",
      authDomain: "tanyaaja-17b48.firebaseapp.com",
      databaseURL: "https://tanyaaja-17b48.firebaseio.com",
      projectId: "tanyaaja-17b48",
      storageBucket: "tanyaaja-17b48.appspot.com",
      messagingSenderId: "416065878381",
      appId: "1:416065878381:web:8672bd86cccce067694264"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const btnUnduh = document.getElementById('btnUnduh');
    const statusText = document.getElementById('statusText');

    // MAPPING HEADER: Pertanyaan
    const headerMapping = {
      "waktu_submit": "Waktu Submit",
      "demo_1": "1. Apakah Anda pernah berbelanja di Indomaret Bengkong Kolam 11 minimal 2 kali?",
      "demo_2": "2. Jenis Kelamin",
      "demo_3": "3. Usia Anda saat ini",
      "demo_4": "4. Pekerjaan",
      "q1": "1 (X1). Produk makanan/minuman yang dijual di gerai ini selalu segar dan tidak kedaluwarsa.",
      "q2": "2 (X1). Variasi dan ketersediaan produk harian yang saya butuhkan di gerai ini tergolong lengkap.",
      "q3": "3 (X1). Kemasan produk fisik yang dipajang di rak dalam kondisi baik (tidak penyok/rusak).",
      "q4": "4 (X2). Fasilitas gerai (AC dingin, ruangan bersih, pencahayaan terang) membuat saya nyaman.",
      "q5": "5 (X2). Proses transaksi di kasir dilayani dengan cepat, tepat, dan antrean teratur.",
      "q6": "6 (X2). Karyawan sigap dan tanggap membantu ketika saya kesulitan mencari letak barang.",
      "q7": "7 (X2). Karyawan memberikan informasi harga promo secara jujur dan sesuai dengan label harga.",
      "q8": "8 (X2). Karyawan menyapa, senyum, dan bersikap ramah selama melayani proses belanja.",
      "q9": "9 (Y). Pengalaman berbelanja di gerai ini sudah sesuai dengan apa yang saya harapkan.",
      "q10": "10 (Y). Secara keseluruhan, saya merasa puas dengan produk dan layanan di gerai ini.",
      "q11": "11 (Y). Saya merasa keputusan saya memilih belanja di gerai ini sudah sangat tepat.",
      "q12": "12 (Z). Saya akan terus kembali berbelanja di gerai ini untuk kebutuhan harian di masa depan.",
      "q13": "13 (Z). Saya tetap memilih gerai ini meskipun ada minimarket pesaing lain di sekitar Bengkong Kolam.",
      "q14": "14 (Z). Saya bersedia merekomendasikan gerai Indomaret ini kepada keluarga, teman, atau tetangga."
    };

    // MAPPING JAWABAN: Menerjemahkan angka 1-5 menjadi teks keterangan
    const skalaLikertMapping = {
      "1": "Sangat Tidak Setuju (STS)",
      "2": "Tidak Setuju (TS)",
      "3": "Netral (N)",
      "4": "Setuju (S)",
      "5": "Sangat Setuju (SS)"
    };

    // Urutan kolom yang diinginkan di file Excel
    const urutanKolom = [
      "waktu_submit", "demo_1", "demo_2", "demo_3", "demo_4",
      "q1", "q2", "q3", "q4", "q5", "q6", "q7", "q8", "q9", "q10", "q11", "q12", "q13", "q14"
    ];

    btnUnduh.addEventListener('click', async () => {
      btnUnduh.disabled = true;
      statusText.textContent = "Sedang mengambil data dari database...";

      try {
        const querySnapshot = await getDocs(collection(db, "jawaban_responden"));
        
        if (querySnapshot.empty) {
          alert("Belum ada data jawaban di database.");
          statusText.textContent = "";
          btnUnduh.disabled = false;
          return;
        }

        let dataArray = [];
        querySnapshot.forEach((doc) => {
          let data = doc.data();
          if (data.waktu_submit) {
            data.waktu_submit = data.waktu_submit.toDate().toLocaleString('id-ID');
          }
          dataArray.push(data);
        });

        // 1. Susun Baris Pertama (Header)
        const headerCsv = urutanKolom.map(kunci => `"${headerMapping[kunci] || kunci}"`).join(",");
        let csvContent = headerCsv + "\n";

        // 2. Susun Baris Isi (Data Jawaban)
        dataArray.forEach(row => {
          let rowData = urutanKolom.map(kunci => {
            let isiSel = row[kunci] === undefined || row[kunci] === null ? "" : row[kunci];
            
            // Jika kolom yang sedang diproses adalah q1 sampai q14, terjemahkan angkanya menjadi keterangan teks
            if (kunci.startsWith("q") && skalaLikertMapping[isiSel]) {
              isiSel = skalaLikertMapping[isiSel];
            }

            return `"${String(isiSel).replace(/"/g, '""').replace(/\n/g, " ")}"`;
          });
          csvContent += rowData.join(",") + "\n";
        });

        // 3. Proses Pengunduhan
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        
        link.setAttribute("href", url);
        link.setAttribute("download", "Data_Kuesioner_Teks.csv");
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        statusText.textContent = `Berhasil mengunduh ${dataArray.length} data responden!`;
      } catch (error) {
        console.error(error);
        statusText.textContent = "Gagal mengambil data.";
        alert("Terjadi kesalahan saat mengambil data.");
      } finally {
        btnUnduh.disabled = false;
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sadewa</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    font-family:'Poppins',sans-serif;
    background:#f8fafc;
}

.credit-box{
    width:100%;
    max-width:600px;
    text-align:center;
    padding:clamp(24px,5vw,48px);
    background:#ffffff;
    border-radius:24px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.icon{
    font-size:clamp(2rem,6vw,3rem);
    margin-bottom:12px;
}

.title{
    font-size:clamp(1.8rem,6vw,3rem);
    font-weight:700;
    color:#0f172a;
    line-height:1.2;
}

.name{
    display:block;
    margin-top:8px;
    color:#2563eb;
}

.subtitle{
    margin-top:16px;
    color:#64748b;
    font-size:clamp(.9rem,2vw,1rem);
    line-height:1.6;
}

@media (max-width:480px){
    .credit-box{
        border-radius:18px;
        padding:24px;
    }
}
</style>
</head>
<body>

<div class="credit-box">
    <div class="icon">👋</div>

    <h1 class="title">
        Created &amp; Developed
        <span class="name">by Sadewa</span>
    </h1>

    <p class="subtitle">
        Thank you for visiting. This project was designed and developed with care to provide the best user experience across all devices.
    </p>
</div>

</body>
</html>

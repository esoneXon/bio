<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sadewa Credit</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b,#0f172a);
    overflow:hidden;
}

/* Background glow */
body::before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    background:radial-gradient(circle,#3b82f655 0%,transparent 70%);
    top:-150px;
    right:-100px;
}

body::after{
    content:"";
    position:absolute;
    width:400px;
    height:400px;
    background:radial-gradient(circle,#8b5cf655 0%,transparent 70%);
    bottom:-120px;
    left:-100px;
}

.container{
    position:relative;
    text-align:center;
    padding:50px 70px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    backdrop-filter:blur(12px);
    border-radius:24px;
    box-shadow:0 20px 40px rgba(0,0,0,0.3);
    animation:float 4s ease-in-out infinite;
}

.subtitle{
    color:#94a3b8;
    font-size:14px;
    letter-spacing:4px;
    text-transform:uppercase;
    margin-bottom:12px;
}

.title{
    font-size:clamp(2rem,5vw,4rem);
    font-weight:700;
    background:linear-gradient(90deg,#60a5fa,#a78bfa,#22d3ee);
    background-size:200% auto;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:gradient 4s linear infinite;
}

.line{
    width:80px;
    height:4px;
    margin:20px auto 0;
    border-radius:10px;
    background:linear-gradient(90deg,#60a5fa,#a78bfa);
}

@keyframes gradient{
    0%{background-position:0% center;}
    100%{background-position:200% center;}
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-10px);
    }
}
</style>
</head>
<body>

<div class="container">
    <div class="subtitle">Official Credit</div>
    <div class="title">Created &amp; Developed<br>by Sadewa</div>
    <div class="line"></div>
</div>

</body>
</html>

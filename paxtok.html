<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PaXtok Web</title>
    
    <!-- Favicon -->
    <link rel="icon" href="https://raw.githubusercontent.com/esoneXon/bio/refs/heads/main/assets/imgs/paxtokimg.png" type="image/png">

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Library untuk Generate Barcode -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    
    <style>
        :root {
            --bg-color: #F2F2F7;
            --card-bg: #FFFFFF;
            --text-main: #000000;
            --text-muted: #8E8E93;
            --blue: #007AFF;
            --red: #FF3B30;
            --green: #34C759;
            --orange: #FF9500;
            --divider: #E5E5EA;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            padding-bottom: 120px; 
            transition: zoom 0.3s ease; 
        }

        /* Utility Classes */
        .hidden { display: none !important; }
        .card { background: var(--card-bg); border-radius: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .flex { display: flex; }
        .flex-col { display: flex; flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .text-center { text-align: center; }
        .font-bold { font-weight: 700; }

        /* Header */
        header { padding: 20px; }
        .logo-img { width: 34px; height: 34px; border-radius: 8px; object-fit: cover; }
        .logo-text { 
            font-size: 26px; 
            margin-left: 12px; 
            flex-grow: 1; 
            letter-spacing: -1px; 
            font-weight: 800;
            background: linear-gradient(90deg, #007AFF 0%, #34C759 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 2px 4px rgba(0,0,0,0.05);
        }
        
        .btn-header {
            border-radius: 17px; padding: 0 14px; height: 34px;
            font-size: 12px; font-weight: 600; line-height: 34px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-zoom { background: #D1D1D6; color: #000; margin-right: 8px; font-size: 14px; }
        .btn-projects { background: var(--divider); color: var(--blue); margin-right: 8px; }
        .btn-csv { background: var(--text-main); color: #FFF; }

        /* Input Manual Container */
        #container_input_manual { margin: 0 16px; padding: 8px; border-radius: 24px; }
        .input-box {
            background: var(--bg-color); border-radius: 16px; height: 48px; border: none;
            padding: 0 16px; font-size: 14px; width: 100%; outline: none; font-weight: 600;
        }
        .add-btn {
            background: var(--blue); color: #FFF; border-radius: 24px; width: 48px; height: 48px;
            font-size: 26px; border: none; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
        }

        /* Global Actions */
        .global-actions { padding: 16px 20px 8px; justify-content: flex-end; gap: 16px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .text-orange { color: var(--orange); }
        .text-red { color: var(--red); }

        /* List Items - NEW WA FORMAT */
        #container_list { display: flex; flex-direction: column; gap: 12px; padding: 4px 16px 0; }
        .item-card { overflow: hidden; }
        
        .barcode-container { margin: 16px 20px 0; text-align: center; }
        .barcode-container svg { width: 100%; height: 50px; }
        
        .wa-format-row { 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 12px 16px 16px; gap: 6px; 
        }
        .wa-item-name { 
            flex: 1.4; font-size: 13px; font-weight: 700; line-height: 1.2; word-break: break-word; 
        }
        .wa-separator { color: var(--text-muted); font-weight: bold; margin: 0 2px; }
        .wa-input-wrapper { flex: 1; }
        .sf-input-small {
            width: 100%; height: 40px; border-radius: 8px; border: none; text-align: center;
            font-size: 16px; font-weight: 700; outline: none;
        }
        .input-stok { background: #F2F2F7; color: var(--text-main); }
        .input-fisik { background: #E5F0FF; color: var(--blue); }
        .wa-selisih { flex: 0.8; text-align: right; font-size: 20px; font-weight: 700; }

        .item-actions { border-top: 1px solid var(--divider); display: flex; height: 45px; }
        .action-btn { flex: 1; background: none; border: none; font-size: 12px; font-weight: 600; cursor: pointer; border-right: 1px solid var(--divider); }
        .action-btn:last-child { border-right: none; }
        .btn-reset-item { color: var(--orange); }
        .btn-updown { color: var(--text-muted); }
        .btn-delete { color: var(--red); font-weight: 700; }

        /* FAB Bottom */
        .fab-container {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: var(--blue); border-radius: 27px; height: 55px; color: #FFF;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15); display: flex; align-items: center; overflow: hidden; z-index: 100;
            width: max-content; 
        }
        .fab-container.mode-review { background: var(--red); }
        .fab-btn { padding: 0 14px; font-size: 13px; font-weight: 700; cursor: pointer; height: 100%; display: flex; align-items: center; white-space: nowrap; }
        .fab-divider { width: 1px; height: 24px; background: rgba(255,255,255,0.3); }

        /* Undo Snackbar */
        #card_undo {
            position: fixed; bottom: 100px; left: 20px; right: 20px; background: #1C1C1E; color: #FFF;
            border-radius: 25px; height: 50px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 8px 0 24px; z-index: 101; transform: translateY(150px); transition: transform 0.3s;
        }
        #card_undo.show { transform: translateY(0); }
        .btn-undo-action { background: #323232; color: #3478F6; border-radius: 17px; padding: 6px 16px; font-weight: 700; font-size: 14px; cursor: pointer; }

        /* Dialogs */
        #dialog_overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4);
            z-index: 200; display: flex; align-items: center; justify-content: center;
        }
        .dialog-card { background: #F2F2F7; border-radius: 18px; width: 80%; max-width: 340px; overflow: hidden; }
        .dialog-content { padding: 20px; text-align: center; }
        .dialog-title { font-size: 17px; font-weight: 700; color: #000; margin-bottom: 6px; }
        .dialog-message { font-size: 13px; color: #3C3C43; margin-bottom: 16px; }
        .dialog-body { margin-bottom: 16px; }
        .dialog-actions { display: flex; border-top: 1px solid rgba(60,60,67,0.29); height: 48px; }
        .dialog-btn { flex: 1; border: none; background: transparent; font-size: 17px; font-weight: 600; color: var(--blue); cursor: pointer; }
        .dialog-btn.bold { font-weight: 700; }
        .dialog-btn.red { color: var(--red); }
        .dialog-divider { width: 1px; background: rgba(60,60,67,0.29); }

        /* Review Container */
        #container_review { padding: 16px; }
        .review-header, .review-row { display: flex; padding: 16px; font-size: 11px; align-items: center; }
        .review-header { background: #F2F2F7; font-weight: 700; color: var(--text-muted); border-radius: 20px 20px 0 0;}
        .review-row { border-bottom: 1px solid var(--divider); }
        .review-row:last-child { border-bottom: none; }
        .r-plu { flex: 1.1; color: var(--text-muted); }
        .r-item { flex: 1.6; font-size: 12px; font-weight: 700; }
        .r-hrg { flex: 1.3; color: var(--blue); font-weight: 700; text-align: center; cursor: pointer; }
        .r-stk { flex: 0.8; text-align: center; }
        .r-fsk { flex: 0.8; text-align: center; }
        .r-sls { flex: 1.0; font-size: 14px; font-weight: 700; text-align: right; }
        .btn-wa { background: var(--green); color: #FFF; border-radius: 16px; height: 55px; width: 100%; border: none; font-size: 15px; font-weight: 700; margin-top: 24px; cursor: pointer; }

        /* Loading */
        #loading_overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.8);
            z-index: 300; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid var(--blue); border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Level Ukuran Info */
        #zoom_indicator {
            position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: white; padding: 6px 16px; border-radius: 20px;
            font-size: 12px; font-weight: 600; z-index: 400; opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Indikator Zoom -->
    <div id="zoom_indicator">Ukuran: Normal</div>

    <!-- Header -->
    <header class="flex items-center">
        <!-- Logo Aplikasi -->
        <img src="https://raw.githubusercontent.com/esoneXon/bio/refs/heads/main/assets/imgs/paxtokimg.png" alt="Logo" class="logo-img">
        <div class="logo-text">PaXtok</div>
        
        <!-- Tombol Pengatur Ukuran -->
        <div class="btn-header btn-zoom" onclick="toggleZoom()" title="Ubah Ukuran Tampilan">Aa</div>
        
        <div class="btn-header btn-projects" onclick="showProjectManager()">PROYEK</div>
        <div class="btn-header btn-csv" onclick="document.getElementById('csv-file').click()">CSV</div>
        <input type="file" id="csv-file" accept=".csv" class="hidden" onchange="handleCSVUpload(event)">
    </header>

    <!-- Input Manual -->
    <div id="container_input_manual" class="card flex items-center">
        <div style="flex:1; margin-right:8px; display:flex; gap:8px;">
            <input type="number" id="et_input_plu" class="input-box" placeholder="PLU" list="plu_list" style="flex:1;">
            <datalist id="plu_list"></datalist>
            <input type="text" id="et_input_item" class="input-box" placeholder="Nama Item" style="flex:1.5; text-transform: uppercase;">
        </div>
        <button class="add-btn font-bold" onclick="performManualAdd()">+</button>
    </div>

    <!-- Global Actions -->
    <div id="container_global_actions" class="flex global-actions">
        <span id="btn_reset_stok" class="text-orange hidden" onclick="resetAllStokFisik()">Kosongkan Stok</span>
        <span id="btn_reset_all" class="text-red hidden" onclick="deleteAllItems()">Hapus Semua</span>
    </div>

    <!-- Main List -->
    <div id="container_list"></div>

    <!-- Review Section -->
    <div id="container_review" class="hidden">
        <div class="card flex-col">
            <div class="review-header">
                <div class="r-plu">PLU</div>
                <div class="r-item">ITEM</div>
                <div class="r-hrg">HRG</div>
                <div class="r-stk">STK</div>
                <div class="r-fsk">FSK</div>
                <div class="r-sls">SLS</div>
            </div>
            <div id="container_review_rows" class="flex-col"></div>
        </div>
        <button class="btn-wa" onclick="prepareWhatsAppReport()">BAGIKAN KE WHATSAPP</button>
    </div>

    <!-- FAB -->
    <div id="fab_container" class="fab-container">
        <div id="btn_quick_save" class="fab-btn" onclick="saveNewProjectDialog()">💾 Simpan</div>
        <div id="fab_divider" class="fab-divider"></div>
        <div id="tv_fab" class="fab-btn" onclick="toggleReviewMode()">Review Selisih</div>
        
        <div id="fab_divider_2" class="fab-divider"></div>
        <div id="btn_try_more" class="fab-btn" onclick="showTryMoreDialog()">✨ Try More</div>
    </div>

    <!-- Undo Snackbar -->
    <div id="card_undo">
        <span id="tv_undo_msg">Item dihapus</span>
        <div class="btn-undo-action" onclick="performUndo()">Batal</div>
    </div>

    <!-- Dialog Overlay -->
    <div id="dialog_overlay" class="hidden">
        <div class="dialog-card flex-col">
            <div class="dialog-content">
                <div id="dialog_title" class="dialog-title">Title</div>
                <div id="dialog_message" class="dialog-message">Message</div>
                <div id="dialog_body" class="dialog-body"></div>
            </div>
            <div class="dialog-actions">
                <button id="dialog_btn_cancel" class="dialog-btn" onclick="closeDialog()">Batal</button>
                <div id="dialog_btn_divider" class="dialog-divider"></div>
                <button id="dialog_btn_save" class="dialog-btn bold">Simpan</button>
            </div>
        </div>
    </div>

    <!-- Loading -->
    <div id="loading_overlay" class="hidden">
        <div class="spinner"></div>
        <div id="tv_loading_msg" style="margin-top:16px; font-weight:bold;">Memproses...</div>
    </div>

    <script>
        // State Variables
        let items = [];
        let masterProducts = {};
        let isReviewMode = false;

        const zoomLevels = [0.8, 0.9, 1.0, 1.1, 1.2];
        const zoomLabels = ["Sangat Kecil", "Kecil", "Normal", "Besar", "Sangat Besar"];
        let currentZoomIdx = 2; 
        let zoomTimeout;

        function initZoom() {
            const savedZoom = localStorage.getItem("app_zoom_idx");
            if (savedZoom !== null) {
                currentZoomIdx = parseInt(savedZoom);
            }
            document.body.style.zoom = zoomLevels[currentZoomIdx];
        }

        function toggleZoom() {
            currentZoomIdx = (currentZoomIdx + 1) % 5;
            document.body.style.zoom = zoomLevels[currentZoomIdx];
            localStorage.setItem("app_zoom_idx", currentZoomIdx);
            const indicator = document.getElementById("zoom_indicator");
            indicator.textContent = "Ukuran: " + zoomLabels[currentZoomIdx];
            indicator.style.opacity = "1";
            clearTimeout(zoomTimeout);
            zoomTimeout = setTimeout(() => { indicator.style.opacity = "0"; }, 1500);
        }

        let pendingUndoType = -1; 
        let backupDataForUndo = [];
        let pendingDeletedItem = null;
        let pendingDeletedIndex = -1;
        let pendingDeletedProjectName = "";
        let pendingDeletedProjectData = "";
        let undoTimeout;

        function init() {
            initZoom(); 
            initSampleProject(); 
            loadSavedData();
            document.getElementById('et_input_plu').addEventListener('input', function(e) {
                const val = this.value;
                if(val.includes(" - ")) {
                    const plu = val.split(" - ")[0];
                    this.value = plu;
                    if(masterProducts[plu]) {
                        document.getElementById('et_input_item').value = masterProducts[plu];
                        document.getElementById('et_input_item').focus();
                    }
                }
            });
            document.getElementById('et_input_item').addEventListener('keypress', function(e) {
                if(e.key === 'Enter') performManualAdd();
            });
        }
        
        function initSampleProject() {
            let list = JSON.parse(localStorage.getItem("project_list") || "[]");
            if(!list.includes("SO RH")) {
                list.push("SO RH");
                localStorage.setItem("project_list", JSON.stringify(list));
                const sampleData = `20024079,TELUR AYAM\n20020184,ASIN MATANG\n10004977,AYAM KAMPUNG\n20080025,TLR MEGA 10's\n20062506,SANFORD\n20062507,GALON SANFORD\n10036631,AQUA\n20121514,LE MINERAL\n20063700,GAS KCL\n20000458,GAS BSR\n20110320,MATERAI\n20134344,SOSIS ORI\n20134345,SOSIS KEJU`;
                let sampleItems = [];
                sampleData.split("\n").forEach(line => {
                    let parts = line.split(",");
                    if(parts.length >= 2) sampleItems.push({plu: parts[0].trim(), item: parts[1].trim(), stok: "", fisik: ""});
                });
                localStorage.setItem("project_data_SO RH", JSON.stringify(sampleItems));
                let activeData = localStorage.getItem("saved_items");
                if (!activeData || activeData === "[]") localStorage.setItem("saved_items", JSON.stringify(sampleItems));
            }
        }

        function loadSavedData() {
            const saved = localStorage.getItem("saved_items");
            if (saved) {
                try {
                    items = JSON.parse(saved);
                    items.forEach(i => { masterProducts[i.plu] = i.item; });
                } catch(e) { items = []; }
            }
            renderList();
            updateDatalist();
        }

        function saveData() {
            localStorage.setItem("saved_items", JSON.stringify(items));
            updateGlobalActionsVisibility();
        }

        function renderList() {
            const container = document.getElementById('container_list');
            container.innerHTML = '';
            items.forEach((item, index) => { container.appendChild(createItemCard(item, index)); });
            updateGlobalActionsVisibility();
        }

        function createItemCard(item, index) {
            const intStok = parseInt(item.stok) || 0;
            const intFisik = parseInt(item.fisik) || 0;
            const selisih = (item.stok === "" && item.fisik === "") ? 0 : (intFisik - intStok);
            const selisihColor = selisih < 0 ? "var(--red)" : (selisih > 0 ? "var(--green)" : "#000");
            const hasInput = item.stok !== "" || item.fisik !== "";

            const div = document.createElement('div');
            div.className = 'card item-card';
            div.innerHTML = `
                <!-- Barcode & PLU Tengah -->
                <div class="text-center" style="margin-bottom: 12px; padding-top: 8px;">
                    <div class="barcode-container" style="margin: 0;">
                        <svg id="barcode-${item.plu}"></svg>
                    </div>
                    <div style="font-size: 18px; font-weight: 800; margin-top: 4px; letter-spacing: 1px;">${item.plu}</div>
                </div>

                <!-- Tampilan Mirip WA Report -->
                <div class="wa-format-row">
                    <div class="wa-item-name">(${item.item.toUpperCase()})</div>
                    <div class="wa-separator">|</div>
                    <div class="wa-input-wrapper">
                        <input type="number" class="sf-input-small input-stok" placeholder="STOK" value="${item.stok}" oninput="updateItemValue(${index}, 'stok', this.value)">
                    </div>
                    <div class="wa-separator">|</div>
                    <div class="wa-input-wrapper">
                        <input type="number" class="sf-input-small input-fisik" placeholder="FISIK" value="${item.fisik}" oninput="updateItemValue(${index}, 'fisik', this.value)">
                    </div>
                    <div class="wa-separator">|</div>
                    <div class="wa-selisih" style="color: ${selisihColor}">
                        ${selisih > 0 ? "+" + selisih : selisih}
                    </div>
                </div>

                <!-- Aksi -->
                <div class="item-actions">
                    <button class="action-btn btn-reset-item ${hasInput ? '' : 'hidden'}" onclick="resetItem(${index})">↺ Reset</button>
                    <button class="action-btn btn-updown" onclick="moveItem(${index}, -1)">▲ Naik</button>
                    <button class="action-btn btn-updown" onclick="moveItem(${index}, 1)">▼ Turun</button>
                    <button class="action-btn btn-delete" onclick="deleteItem(${index})">Hapus</button>
                </div>
            `;
            setTimeout(() => { try { JsBarcode(`#barcode-${item.plu}`, item.plu, { format: "CODE128", width: 2, height: 40, displayValue: false }); } catch(e){} }, 10);
            return div;
        }

        function updateItemValue(index, field, value) {
            items[index][field] = value;
            saveData();
            
            const intStok = parseInt(items[index].stok) || 0;
            const intFisik = parseInt(items[index].fisik) || 0;
            const selisih = (items[index].stok === "" && items[index].fisik === "") ? 0 : (intFisik - intStok);
            const selisihStr = selisih > 0 ? "+" + selisih : selisih;
            const selisihColor = selisih < 0 ? "var(--red)" : (selisih > 0 ? "var(--green)" : "#000");
            
            const card = document.getElementById('container_list').children[index];
            const selisihEl = card.querySelector('.wa-selisih');
            selisihEl.textContent = selisihStr;
            selisihEl.style.color = selisihColor;
            
            const btnReset = card.querySelector('.btn-reset-item');
            if(items[index].stok !== "" || items[index].fisik !== "") {
                btnReset.classList.remove('hidden');
            } else {
                btnReset.classList.add('hidden');
            }
            updateGlobalActionsVisibility();
        }

        function performManualAdd() {
            commitPendingDeletion();
            const plu = document.getElementById('et_input_plu').value.trim();
            const itemName = document.getElementById('et_input_item').value.trim().toUpperCase();
            if(plu && itemName) {
                if(!/^\d+$/.test(plu)) { alert("PLU harus berupa angka"); return; }
                items.push({ plu: plu, item: itemName, stok: "", fisik: "" });
                masterProducts[plu] = itemName;
                saveData();
                renderList();
                updateDatalist();
                document.getElementById('et_input_plu').value = "";
                document.getElementById('et_input_item').value = "";
                document.getElementById('et_input_plu').focus();
            }
        }

        function moveItem(index, dir) {
            commitPendingDeletion();
            if(index + dir < 0 || index + dir >= items.length) return;
            const temp = items[index];
            items[index] = items[index + dir];
            items[index + dir] = temp;
            saveData();
            renderList();
        }

        function resetItem(index) {
            items[index].stok = "";
            items[index].fisik = "";
            saveData();
            renderList();
        }

        function deleteItem(index) {
            commitPendingDeletion();
            pendingDeletedItem = items[index];
            pendingDeletedIndex = index;
            items.splice(index, 1);
            saveData();
            renderList();
            showUndoSnackbar("Item berhasil dihapus", 0);
        }

        function deleteAllItems() {
            if(items.length === 0) return;
            showConfirmDialog("Hapus Semua Data?", "Seluruh barang di layar akan dihapus.", "HAPUS", "Batal", () => {
                commitPendingDeletion();
                backupDataForUndo = JSON.parse(JSON.stringify(items));
                items = [];
                saveData();
                renderList();
                showUndoSnackbar("Semua item dihapus", 1);
            });
        }

        function resetAllStokFisik() {
            if(items.length === 0) return;
            showConfirmDialog("Kosongkan Stok & Fisik?", "Semua angka akan dihapus, nama barang tetap ada.", "KOSONGKAN", "Batal", () => {
                commitPendingDeletion();
                backupDataForUndo = JSON.parse(JSON.stringify(items));
                items.forEach(i => { i.stok = ""; i.fisik = ""; });
                saveData();
                renderList();
                showUndoSnackbar("Stok & Fisik dikosongkan", 2);
            });
        }

        function updateGlobalActionsVisibility() {
            if (isReviewMode) {
                document.getElementById('container_global_actions').classList.add('hidden');
                return;
            }
            if (items.length === 0) {
                document.getElementById('container_global_actions').classList.add('hidden');
            } else {
                document.getElementById('container_global_actions').classList.remove('hidden');
                document.getElementById('btn_reset_all').classList.remove('hidden');
                const hasData = items.some(i => i.stok !== "" || i.fisik !== "");
                document.getElementById('btn_reset_stok').classList.toggle('hidden', !hasData);
            }
        }

        function handleCSVUpload(event) {
            const file = event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result.replace(/\r/g, "");
                const lines = text.split("\n");
                commitPendingDeletion();
                items = [];
                masterProducts = {};
                lines.forEach((line, index) => {
                    if(!line.trim()) return;
                    const parts = line.split(",");
                    if(parts.length >= 2) {
                        if(index === 0 && parts[0].toLowerCase().includes("plu")) return;
                        const plu = parts[0].trim();
                        const item = parts[1].trim();
                        if(/^\d+$/.test(plu)) {
                            items.push({plu: plu, item: item, stok: "", fisik: ""});
                            masterProducts[plu] = item;
                        }
                    }
                });
                saveData();
                renderList();
                updateDatalist();
                event.target.value = ""; 
            };
            reader.readAsText(file);
        }

        function updateDatalist() {
            const dl = document.getElementById('plu_list');
            dl.innerHTML = '';
            for(let plu in masterProducts) {
                let opt = document.createElement('option');
                opt.value = plu + " - " + masterProducts[plu];
                dl.appendChild(opt);
            }
        }

        function showUndoSnackbar(msg, type) {
            pendingUndoType = type;
            document.getElementById('tv_undo_msg').textContent = msg;
            const bar = document.getElementById('card_undo');
            bar.classList.add('show');
            clearTimeout(undoTimeout);
            undoTimeout = setTimeout(() => { commitPendingDeletion(); }, 10000);
        }

        function commitPendingDeletion() {
            if(pendingUndoType !== -1) {
                document.getElementById('card_undo').classList.remove('show');
                pendingUndoType = -1;
                pendingDeletedItem = null;
                pendingDeletedIndex = -1;
                backupDataForUndo = [];
            }
        }

        function performUndo() {
            clearTimeout(undoTimeout);
            if(pendingUndoType === 0 && pendingDeletedItem) {
                items.splice(pendingDeletedIndex, 0, pendingDeletedItem);
            } else if ((pendingUndoType === 1 || pendingUndoType === 2) && backupDataForUndo.length > 0) {
                items = JSON.parse(JSON.stringify(backupDataForUndo));
            } else if (pendingUndoType === 3 && pendingDeletedProjectName) {
                let list = JSON.parse(localStorage.getItem("project_list") || "[]");
                if(!list.includes(pendingDeletedProjectName)) list.push(pendingDeletedProjectName);
                localStorage.setItem("project_list", JSON.stringify(list));
                localStorage.setItem("project_data_" + pendingDeletedProjectName, pendingDeletedProjectData);
            }
            saveData();
            renderList();
            document.getElementById('card_undo').classList.remove('show');
            pendingUndoType = -1;
        }

        function toggleReviewMode() {
            commitPendingDeletion();
            isReviewMode = !isReviewMode;
            const fab = document.getElementById('fab_container');
            const tvFab = document.getElementById('tv_fab');
            
            if (isReviewMode) {
                tvFab.textContent = "Kembali ke Input";
                fab.classList.add('mode-review');
                document.getElementById('btn_quick_save').classList.add('hidden');
                document.getElementById('fab_divider').classList.add('hidden');
                document.getElementById('fab_divider_2').classList.add('hidden');
                document.getElementById('btn_try_more').classList.add('hidden');
                document.getElementById('container_input_manual').classList.add('hidden');
                document.getElementById('container_list').classList.add('hidden');
                document.getElementById('container_review').classList.remove('hidden');
                renderReviewTable();
            } else {
                tvFab.textContent = "Review Selisih";
                fab.classList.remove('mode-review');
                document.getElementById('btn_quick_save').classList.remove('hidden');
                document.getElementById('fab_divider').classList.remove('hidden');
                document.getElementById('fab_divider_2').classList.remove('hidden');
                document.getElementById('btn_try_more').classList.remove('hidden');
                document.getElementById('container_input_manual').classList.remove('hidden');
                document.getElementById('container_list').classList.remove('hidden');
                document.getElementById('container_review').classList.add('hidden');
            }
            updateGlobalActionsVisibility();
        }

        // DI WEB HANYA TAMPILKAN YANG PLUS SAMA MINUS (!= 0)
        function renderReviewTable() {
            const container = document.getElementById('container_review_rows');
            container.innerHTML = '';
            let prices = JSON.parse(localStorage.getItem("ManualPrices") || "{}");
            items.forEach((item) => {
                const s = parseInt(item.stok) || 0;
                const f = parseInt(item.fisik) || 0;
                const selisih = f - s;
                
                if (selisih !== 0) {
                    const price = prices[item.plu] || 0;
                    const priceStr = price > 0 ? "Rp " + price.toLocaleString('id-ID') : "Rp 0";
                    const selisihColor = selisih < 0 ? "var(--red)" : "var(--green)";
                    const selisihStr = selisih > 0 ? "+" + selisih : selisih;

                    const row = document.createElement('div');
                    row.className = 'review-row';
                    row.innerHTML = `
                        <div class="r-plu">${item.plu}</div>
                        <div class="r-item">${item.item}</div>
                        <div class="r-hrg" onclick="askPrice('${item.plu}', '${item.item.replace(/'/g, "\\'")}', ${price})">${priceStr}</div>
                        <div class="r-stk">${s}</div>
                        <div class="r-fsk">${f}</div>
                        <div class="r-sls" style="color:${selisihColor}">${selisihStr}</div>
                    `;
                    container.appendChild(row);
                }
            });
        }

        function askPrice(plu, item, currentPrice) {
            showInputDialog("Ubah Harga", `${plu} - ${item}`, "Rp 0", currentPrice ? currentPrice : "", "Simpan", "Batal", true, (val) => {
                let prices = JSON.parse(localStorage.getItem("ManualPrices") || "{}");
                prices[plu] = parseInt(val);
                localStorage.setItem("ManualPrices", JSON.stringify(prices));
                renderReviewTable();
            });
        }

        async function prepareWhatsAppReport() {
            setLoading(true, "Menarik harga...");
            let prices = JSON.parse(localStorage.getItem("ManualPrices") || "{}");
            
            let reportData = [];
            for (let i = 0; i < items.length; i++) {
                let item = items[i];
                const s = parseInt(item.stok) || 0;
                const f = parseInt(item.fisik) || 0;
                const selisih = f - s;
                
                let price = prices[item.plu] || 0;
                
                if(selisih !== 0 && price === 0) {
                    try {
                        const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://www.klikindomaret.com/xpress/' + item.plu)}`);
                        if(res.ok) {
                            const data = await res.json();
                            const match = data.contents.match(/Rp\s*([0-9]{1,3}(?:\.[0-9]{3})*)/) || data.contents.match(/"price"\s*:\s*"?(\d+)"?/);
                            if(match) price = parseInt(match[1].replace(/\./g, ''));
                        }
                    } catch(e) {}
                }
                reportData.push({...item, stok: s, fisik: f, selisih: selisih, harga: price});
            }
            
            setLoading(false);
            promptMissingPrices(reportData, 0);
        }

        function promptMissingPrices(reportList, index) {
            if (index >= reportList.length) {
                generateWAWithAllItems(reportList);
                return;
            }
            const item = reportList[index];
            
            if (item.selisih !== 0 && item.harga === 0) {
                showInputDialog("Input Harga Baru", `${item.plu} - ${item.item}`, "Rp 0", "", "SIMPAN", "Lewati", true, (val) => {
                    if(val) {
                        item.harga = parseInt(val);
                        let prices = JSON.parse(localStorage.getItem("ManualPrices") || "{}");
                        prices[item.plu] = item.harga;
                        localStorage.setItem("ManualPrices", JSON.stringify(prices));
                    }
                    promptMissingPrices(reportList, index + 1);
                });
            } else {
                promptMissingPrices(reportList, index + 1);
            }
        }

        // LAPORAN SALIN: TAMPIL LENGKAP & KOSONG JADI 0
        function generateWAWithAllItems(reportList) {
            let totalPlus = 0;
            let totalMinus = 0;
            let sbDetail = "";

            reportList.forEach(item => {
                const sStr = item.selisih > 0 ? "+" + item.selisih : item.selisih;
                
                sbDetail += `${item.plu}\n(${item.item}) | ${item.stok} | ${item.fisik} | ${sStr}\n`;
                
                const rupiah = Math.abs(item.selisih * item.harga);
                if(item.selisih > 0) totalPlus += rupiah;
                else if(item.selisih < 0) totalMinus += rupiah;
                
                if(item.selisih !== 0) sbDetail += `Rp. ${rupiah.toLocaleString('id-ID')}\n`;
                sbDetail += `\n`;
            });

            const now = new Date();
            const dateStr = now.toLocaleDateString('id-ID', {day: '2-digit', month: 'long', year: 'numeric'}) + ", " + now.toLocaleTimeString('id-ID', {hour: '2-digit', minute: '2-digit'});
            
            const hours = now.getHours();
            const mins = now.getMinutes();
            const timeVal = hours * 100 + mins;
            const shift = (timeVal >= 630 && timeVal < 1430) ? "1" : (timeVal >= 1430 && timeVal < 2230) ? "2" : "3";

            let finalMsg = `*LAPORAN SO RH*\n${dateStr}\nShift: ${shift}\n\nPLU | ITEM | STOK | FISIK | SELISIH\n\n${sbDetail}*TOTAL ESTIMASI RUPIAH*\nTotal Plus (+): Rp ${totalPlus.toLocaleString('id-ID')}\nTotal Minus (-): -Rp ${totalMinus.toLocaleString('id-ID')}\n`;

            showReportFallback(finalMsg);
        }

        function showReportFallback(msg) {
            let html = `<textarea id="report_text_area" style="width:100%; height:200px; font-size:12px; font-family:monospace; padding:12px; border-radius:12px; border:1px solid var(--divider); resize:none; background: #FFF; outline:none; color: var(--text-main);" readonly></textarea>`;
            showDialog("Laporan", "Silakan salin laporan di bawah ini:", html, [
                { text: "Batal", class: "red", onclick: closeDialog },
                { text: "Salin", class: "bold", onclick: () => {
                    let ta = document.getElementById('report_text_area');
                    ta.select();
                    document.execCommand('copy');
                    alert("Laporan berhasil disalin!");
                    closeDialog();
                }}
            ]);
            setTimeout(() => { document.getElementById('report_text_area').value = msg; }, 50);
        }

        function showProjectManager() {
            let list = JSON.parse(localStorage.getItem("project_list") || "[]");
            let html = "";
            list.forEach(p => {
                html += `<div style="display:flex; padding:14px 16px; border-bottom:1px solid var(--divider); align-items:center; cursor:pointer;" onclick="actionProject('${p}')">
                        <span style="font-size:18px; margin-right:12px;">📁</span>
                        <span style="flex:1; font-weight: 600;">${p}</span>
                        <span style="color:#C7C7CC; font-size:22px;">›</span>
                    </div>`;
            });
            showDialog("Kelola Sesi Project", "", html, [
                { text: "Tutup", class: "", onclick: closeDialog },
                { text: "+ Baru", class: "bold", onclick: saveNewProjectDialog }
            ]);
        }

        function showTryMoreDialog() {
            let html = `
                <div style="display:flex; padding:14px 16px; border-bottom:1px solid var(--divider); align-items:center; cursor:pointer;" onclick="window.open('https://esonexon.github.io/bio/bepex.html', '_blank')">
                    <span style="font-size:20px; margin-right:12px;">📦</span>
                    <span style="flex:1; font-weight: 600; text-align: left; color: var(--text-main);">1. BepEx</span>
                </div>
                <div style="display:flex; padding:14px 16px; align-items:center; cursor:pointer;" onclick="window.open('https://esonexon.github.io/bio/bargen.html', '_blank')">
                    <span style="font-size:20px; margin-right:12px;">🔣</span>
                    <span style="flex:1; font-weight: 600; text-align: left; color: var(--text-main);">2. BarGen</span>
                </div>
            `;
            showDialog("Coba Aplikasi Lainnya", "Jelajahi project portofolio lainnya:", html, [{ text: "Tutup", class: "bold", onclick: closeDialog }]);
        }

        function actionProject(name) {
            let html = `
                <div style="padding:16px; color:var(--blue); font-size:16px; font-weight:600; border-bottom:1px solid var(--divider); cursor:pointer;" onclick="openProject('${name}')">📂 Buka Sesi</div>
                <div style="padding:16px; color:var(--green); font-size:16px; font-weight:600; border-bottom:1px solid var(--divider); cursor:pointer;" onclick="exportProject('${name}')">⬇️ Ekspor ke File</div>
            `;
            if (name !== "SO RH") html += `<div style="padding:16px; color:var(--red); font-size:16px; font-weight:600; cursor:pointer;" onclick="deleteProject('${name}')">🗑 Hapus Project</div>`;
            else html += `<div style="padding:16px; color:var(--text-muted); font-size:16px; font-weight:600;">🔒 Project Sample</div>`;
            showDialog(name, "", html, [{ text: "Tutup", class: "", onclick: closeDialog }]);
        }

        function saveNewProjectDialog() {
            closeDialog();
            if(items.length === 0) { alert("Belum ada item."); return; }
            showInputDialog("Simpan Project", "", "Nama Project", "", "SIMPAN", "Batal", false, (val) => {
                if(!val) return;
                if (val.toUpperCase() === "SO RH") { alert("Tidak bisa menimpa SO RH."); return; }
                let list = JSON.parse(localStorage.getItem("project_list") || "[]");
                if(!list.includes(val)) list.push(val);
                localStorage.setItem("project_list", JSON.stringify(list));
                localStorage.setItem("project_data_" + val, JSON.stringify(items));
                alert("Project tersimpan!");
            });
        }

        function openProject(name) {
            showConfirmDialog("Buka Project?", "Data saat ini akan diganti.", "YA BUKA", "Batal", () => {
                if(isReviewMode) toggleReviewMode();
                let data = localStorage.getItem("project_data_" + name);
                if(data) { items = JSON.parse(data); saveData(); renderList(); }
            });
        }

        function exportProject(name) {
            let data = JSON.parse(localStorage.getItem("project_data_" + name) || "[]");
            let csv = "PLU,ITEM,STOK,FISIK,SELISIH\n";
            data.forEach(i => csv += `${i.plu},${i.item},${i.stok},${i.fisik},${parseInt(i.fisik||0)-parseInt(i.stok||0)}\n`);
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `PaXtok_${name}.csv`; a.click();
        }

        function deleteProject(name) {
            if (name === "SO RH") return;
            showConfirmDialog("Hapus Project?", "Project " + name + " akan dihapus.", "HAPUS", "Batal", () => {
                let list = JSON.parse(localStorage.getItem("project_list") || "[]");
                list = list.filter(p => p !== name);
                localStorage.setItem("project_list", JSON.stringify(list));
                localStorage.removeItem("project_data_" + name);
                showUndoSnackbar("Project dihapus", 3);
            });
        }

        function showDialog(title, msg, customHtml, buttons) {
            document.getElementById('dialog_title').textContent = title;
            document.getElementById('dialog_message').textContent = msg;
            document.getElementById('dialog_body').innerHTML = customHtml;
            const actions = document.querySelector('.dialog-actions');
            actions.innerHTML = '';
            buttons.forEach((b, i) => {
                const btn = document.createElement('button');
                btn.className = `dialog-btn ${b.class}`;
                btn.textContent = b.text;
                btn.onclick = () => { if(b.onclick) b.onclick(); };
                actions.appendChild(btn);
            });
            document.getElementById('dialog_overlay').classList.remove('hidden');
        }

        function closeDialog() { document.getElementById('dialog_overlay').classList.add('hidden'); }

        function showConfirmDialog(title, msg, posBtn, negBtn, onPos) {
            showDialog(title, msg, "", [
                { text: negBtn, class: "", onclick: closeDialog },
                { text: posBtn, class: posBtn === "HAPUS" ? "red bold" : "bold", onclick: () => { closeDialog(); onPos(); } }
            ]);
        }

        function showInputDialog(title, msg, hint, defVal, posBtn, negBtn, isNumber, onSave) {
            const inputHtml = `<input type="${isNumber ? 'number' : 'text'}" id="dialog_input_val" class="input-box" style="text-align:center; background:#FFF;" placeholder="${hint}" value="${defVal}">`;
            showDialog(title, msg, inputHtml, [
                { text: negBtn, class: "", onclick: closeDialog },
                { text: posBtn, class: "bold", onclick: () => { 
                    const val = document.getElementById('dialog_input_val').value.trim();
                    if(!val) alert("Input tidak boleh kosong"); else { closeDialog(); onSave(val); }
                }}
            ]);
        }

        function setLoading(show, msg) {
            const el = document.getElementById('loading_overlay');
            if(show) { document.getElementById('tv_loading_msg').textContent = msg; el.classList.remove('hidden'); } 
            else { el.classList.add('hidden'); }
        }

        window.onload = init;

    </script>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f2f3f5">
<meta name="application-name" content="BARGEN">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BARGEN">
<link rel="icon" type="image/svg+xml" href="./bargen-icon.svg">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<title>BARGEN — Barcode Generator</title>
<style>
:root{--bg:#f2f3f5;--panel:#fff;--ink:#14161a;--muted:#666d78;--line:#e1e4e9;--primary:#14161a;--soft:#eceef2;--red:#c62828;--green:#18794e;--laser:#e03a2f;--radius:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:3px solid #2f6fed;outline-offset:2px}
.topbar{position:sticky;top:0;z-index:20;min-height:56px;background:var(--bg);display:flex;align-items:center;gap:10px;padding:env(safe-area-inset-top) 16px 0}
.topbar h1{margin:0;font-size:22px;letter-spacing:-.01em}
.icon-btn{width:40px;height:40px;border:0;border-radius:12px;background:#fff;font-size:20px;align-items:center;justify-content:center}
.content{max-width:960px;margin:0 auto;padding:8px 16px calc(110px + env(safe-area-inset-bottom))}
.page{display:none}.page.active{display:block}
.panel{background:var(--panel);border-radius:var(--radius);padding:16px;margin-bottom:12px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.panel-head h3{margin:0;font-size:17px}.panel-head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin:22px 0 8px}.sec-head h2{margin:0;font-size:16px}
.split{display:grid;gap:0;align-items:start}
.field{display:grid;gap:6px;margin-bottom:14px;min-width:0}.field label{font-weight:600;font-size:14px}.opt{font-weight:400;color:var(--muted)}
.field input,.field select,.field textarea,.search{width:100%;min-height:48px;border:1px solid #cfd4dc;border-radius:10px;padding:10px 12px;background:#fff;min-width:0}
.field textarea{min-height:160px;resize:vertical;font-family:ui-monospace,Menlo,monospace}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid .field{margin-bottom:0}.span2{grid-column:1/-1}
.help,.footer-note{color:var(--muted);font-size:13px}.footer-note{margin-top:12px}
.more{margin:4px 0}.more summary{cursor:pointer;font-weight:600;color:var(--muted);padding:10px 0;list-style:none}.more summary::before{content:"+  "}.more[open] summary::before{content:"\2212  "}.more .form-grid{margin:4px 0 8px}
.btn{min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.danger{color:var(--red)}.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}.btn.full{width:100%}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.actions .primary{flex:1 1 160px}

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kuesioner Indomaret</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #F6F6F2; /* Warna latar off-white */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #app-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      background-image: radial-gradient(#e0e0e0 1px, transparent 1px);
      background-size: 20px 20px;
    }

    /* Screen Management */
    .screen {
      display: none;
      flex-direction: column;
      height: 100%;
      width: 100%;
      box-sizing: border-box;
      position: absolute;
      top: 0;
      left: 0;
    }
    .screen.active {
      display: flex;
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

    /* Top Section (Question) */
    .top-section {
      padding: 40px 30px 20px 30px;
      flex-shrink: 0;
    }
    .progress-bar {
      display: flex;
      gap: 4px;
      margin-bottom: 30px;
    }
    .progress-dot {
      height: 6px;
      flex-grow: 1;
      background-color: #e0e0e0;
      border-radius: 4px;
    }
    .progress-dot.active {
      background-color: #4CB5F9; /* Biru seperti gambar */
    }
    .question-text {
      font-size: 26px;
      font-weight: 800;
      color: #1A1A1A;
      line-height: 1.3;
      margin: 0;
    }

    /* Bottom Section (Yellow Card) */
    .yellow-card {
      background-color: #FFD84D;
      border-radius: 40px 40px 0 0;
      padding: 40px 30px 30px 30px;
      margin-top: auto;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      overflow-y: auto;
    }

    /* Input & Options */
    .option-btn {
      background-color: white;
      border: 3px solid transparent;
      border-radius: 16px;
      padding: 18px 20px;
      margin-bottom: 12px;
      font-size: 15px;
      font-weight: 600;
      color: #333;
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: 0.2s;
    }
    .option-btn:hover { border-color: #f0f0f0; }
    .option-btn.selected {
      border-color: #1A1A1A;
      background-color: #fdfdfd;
    }
    .option-label {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background-color: #e0f2fe;
      color: #0369a1;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-right: 15px;
      font-size: 12px;
      flex-shrink: 0;
    }
    
    input[type="number"] {
      width: 100%;
      box-sizing: border-box;
      padding: 20px;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      outline: none;
      margin-bottom: 20px;
      background: rgba(255,255,255,0.6);
    }
    input[type="number"]:focus { background: white; }

    /* Submit Button */
    .btn-submit {
      background-color: #1A1A1A;
      color: white;
      border: none;
      border-radius: 30px;
      padding: 20px;
      font-size: 16px;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      margin-top: auto;
      transition: 0.3s;
      width: 100%;
    }
    .btn-submit:disabled { background-color: #666; cursor: not-allowed; }

    /* Intro & Outro Special Style */
    .center-content {
      text-align: center;
      justify-content: center;
      align-items: center;
      padding: 40px;
    }
    .center-content h1 { font-size: 28px; color: #1A1A1A; margin-bottom: 20px; line-height: 1.4; }
    .center-content p { font-size: 16px; color: #555; margin-bottom: 40px; }

  </style>
</head>
<body>

  <div id="app-container">
    
    <!-- 1. INTRO SCREEN -->
    <div id="screen-intro" class="screen center-content active">
      <h1>Selamat Datang 👋</h1>
      <p>Minta waktunya sebentar ya untuk isi kuis ini 😁🙏</p>
      <button class="btn-submit" id="btn-mulai">Mulai Kuis</button>
    </div>

    <!-- 2. QUIZ SCREEN -->
    <div id="screen-quiz" class="screen">
      <div class="top-section">
        <div class="progress-bar" id="progress-bar">
          <!-- Dots akan digenerate oleh JS -->
        </div>
        <h2 class="question-text" id="question-text">Loading pertanyaan...</h2>
      </div>
      
      <div class="yellow-card">
        <div id="input-area">
          <!-- Opsi jawaban atau input teks akan muncul di sini -->
        </div>
        <button class="btn-submit" id="btn-next" disabled>Selanjutnya</button>
      </div>
    </div>

    <!-- 3. OUTRO SCREEN -->
    <div id="screen-outro" class="screen center-content">
      <h1 style="font-size: 40px;">🎉</h1>
      <h1>Terimakasih!</h1>
      <p>Sudah meluangkan waktu untuk mengisi kuis ini ❤️😁</p>
    </div>

  </div>

  <!-- Hubungkan ke file app.js -->
  <script type="module" src="app.js"></script>
</body>
</html>
